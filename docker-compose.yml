services:
  ai-video-transcriber:
    build: .
    ports:
      - "8001:8000"
    environment:
      # 必需：OpenAI API密钥（请在.env文件中设置或直接修改）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy}
      # 本地 Qwen2.5-VL-3B（通过 Docker 网关访问宿主机）
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://172.17.0.1:8081/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf}
      # 宿主机 whisper.cpp 服务
      - WHISPER_SERVER_URL=${WHISPER_SERVER_URL:-http://172.17.0.1:8094/transcribe}
      # 可选：Whisper模型大小
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-base}
      # 服务器配置
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./temp:/app/temp
      - ./data:/app/data
    restart: unless-stopped
    
    # 资源限制（可选）
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
